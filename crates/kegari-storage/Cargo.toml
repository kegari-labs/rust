[package]
name = "kegari-storage"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
kegari-digest = { path = "../kegari-digest" }
kegari-types = { path = "../kegari-types" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.18.1", features = ["v4"] }
libc = "=0.2.189"
fs2 = "=0.4.3"

[dev-dependencies]
tempfile = "=3.23.0"
