[package]
name = "kegari-providers"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
kegari-config = { path = "../kegari-config" }
kegari-digest = { path = "../kegari-digest" }
kegari-types = { path = "../kegari-types" }
base64 = "=0.22.1"
chrono = { version = "=0.4.45", features = ["serde"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["time"] }
url = { version = "=2.5.8", features = ["serde"] }
uuid = { version = "=1.18.1", default-features = false, features = ["std", "serde"] }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync"] }
uuid = { version = "=1.18.1", default-features = false, features = ["std", "serde", "v4"] }
