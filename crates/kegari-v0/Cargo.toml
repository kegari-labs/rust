[package]
name = "kegari-v0"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
kegari-context = { path = "../kegari-context" }
kegari-codex = { path = "../kegari-codex" }
kegari-control-api = { path = "../kegari-control-api" }
kegari-secrets = { path = "../kegari-secrets" }
kegari-platform = { path = "../kegari-platform" }
kegari-process = { path = "../kegari-process" }
kegari-storage = { path = "../kegari-storage" }
kegari-digest = { path = "../kegari-digest" }
kegari-providers = { path = "../kegari-providers" }
kegari-config = { path = "../kegari-config" }
kegari-types = { path = "../kegari-types" }
base64 = "=0.22.1"
chrono = { version = "=0.4.45", features = ["serde"] }
clap = { version = "=4.6.7", features = ["derive"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
hex = "=0.4.3"
libc = "=0.2.189"
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "json", "stream"] }
ring = "=0.17.14"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
sha1 = "=0.10.6"
tokio = { version = "=1.53.1", features = ["full"] }
toml = "=0.9.8"
url = { version = "=2.5.8", features = ["serde"] }
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
zip = { version = "=9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "=3.23.0"

[build-dependencies]
sha2 = "=0.10.9"
