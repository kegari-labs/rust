[package]
name = "kegari-secrets"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
kegari-digest = { path = "../kegari-digest" }
kegari-types = { path = "../kegari-types" }
serde = { version = "=1.0.229", features = ["derive"] }
hmac = "=0.12.1"
sha2 = "=0.10.9"
hex = "=0.4.3"
ring = "=0.17.14"
uuid = { version = "=1.18.1", default-features = false, features = ["std"] }

[dev-dependencies]
serde_json = "=1.0.151"
