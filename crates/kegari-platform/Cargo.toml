[package]
name = "kegari-platform"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
kegari-process = { path = "../kegari-process" }
kegari-digest = { path = "../kegari-digest" }
kegari-types = { path = "../kegari-types" }
serde = { version = "=1.0.229", features = ["derive"] }
libc = "=0.2.189"
tokio = { version = "=1.53.1", features = ["process", "time"] }
uuid = { version = "=1.18.1", default-features = false, features = ["std", "serde"] }

[dev-dependencies]
tempfile = "=3.23.0"
serde_json = "=1.0.151"
uuid = { version = "=1.18.1", default-features = false, features = ["std", "v4"] }
