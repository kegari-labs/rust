[package]
name = "kegari-git"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
kegari-types = { path = "../kegari-types" }
kegari-digest = { path = "../kegari-digest" }
serde = { version = "=1.0.229", features = ["derive"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std", "serde"] }
uuid = { version = "=1.18.1", default-features = false, features = ["std", "serde"] }

[dev-dependencies]
serde_json = "=1.0.151"
