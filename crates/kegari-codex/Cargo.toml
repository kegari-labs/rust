[package]
name = "kegari-codex"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
kegari-digest = { path = "../kegari-digest" }
kegari-types = { path = "../kegari-types" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
tokio = { version = "=1.53.1", features = ["io-util", "time", "rt-multi-thread", "sync", "macros"] }
uuid = { version = "=1.18.1", default-features = false, features = ["std", "serde"] }

[dev-dependencies]
kegari-storage = { path = "../kegari-storage" }
tempfile = "=3.23.0"
uuid = { version = "=1.18.1", default-features = false, features = ["std", "serde", "v4"] }
sha2 = "=0.10.9"
hex = "=0.4.3"
tokio = { version = "=1.53.1", features = ["macros", "rt"] }
