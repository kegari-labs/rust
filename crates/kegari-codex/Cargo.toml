[package]
name = "kegari-codex"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
kegari-types = { path = "../kegari-types" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
tokio = { version = "=1.53.1", features = ["io-util", "time"] }

[dev-dependencies]
sha2 = "=0.10.9"
hex = "=0.4.3"
tokio = { version = "=1.53.1", features = ["macros", "rt"] }
