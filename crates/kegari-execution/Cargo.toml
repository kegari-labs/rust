[package]
name = "kegari-execution"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
kegari-types = { path = "../kegari-types" }
kegari-digest = { path = "../kegari-digest" }
kegari-platform = { path = "../kegari-platform" }
kegari-process = { path = "../kegari-process" }
kegari-storage = { path = "../kegari-storage" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
libc = "=0.2.189"
sha2 = "=0.10.9"
hex = "=0.4.3"
uuid = { version = "=1.18.1", default-features = false, features = ["std", "serde"] }
tokio = { version = "=1.53.1", features = ["process", "io-util", "time", "rt", "macros"] }

[dev-dependencies]
tempfile = "=3.23.0"
uuid = { version = "=1.18.1", default-features = false, features = ["std", "v4"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread"] }
