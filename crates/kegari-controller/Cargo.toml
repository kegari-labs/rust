[package]
name = "kegari-controller"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
kegari-v0 = { path = "../kegari-v0" }
kegari-control-api = { path = "../kegari-control-api" }
kegari-config = { path = "../kegari-config" }
kegari-digest = { path = "../kegari-digest" }
kegari-platform = { path = "../kegari-platform" }
kegari-secrets = { path = "../kegari-secrets" }
kegari-storage = { path = "../kegari-storage" }
kegari-types = { path = "../kegari-types" }
chrono = { version = "=0.4.45", features = ["serde"] }
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["full"] }
toml = "=0.9.8"
uuid = { version = "=1.18.1", features = ["v4", "serde"] }

[dev-dependencies]
axum = { version = "=0.8.6", features = ["json", "http1", "tokio"] }
tower = { version = "=0.5.3", features = ["util"] }
tempfile = "=3.23.0"
