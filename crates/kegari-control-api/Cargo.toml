[package]
name = "kegari-control-api"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
kegari-config = { path = "../kegari-config" }
kegari-digest = { path = "../kegari-digest" }
kegari-process = { path = "../kegari-process" }
kegari-secrets = { path = "../kegari-secrets" }
kegari-storage = { path = "../kegari-storage" }
kegari-types = { path = "../kegari-types" }
axum = { version = "=0.8.6", features = ["json", "http1", "tokio"] }
chrono = { version = "=0.4.45", features = ["serde"] }
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["server", "tokio", "service"] }
libc = "=0.2.189"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "=2.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["full"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
webpki-roots = "=1.0.11"
x509-parser = { version = "=0.18.1", default-features = false }

[dev-dependencies]
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "json", "stream"] }
tower = { version = "=0.5.3", features = ["util"] }
tempfile = "=3.23.0"
